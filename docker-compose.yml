services:
  backend:
    build: ./backend
    ports:
      - "8081:8081"
    environment:
      - SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./backend/data:/data

  frontend:
    build: ./frontend
    ports:
      - "3001:3001"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data: