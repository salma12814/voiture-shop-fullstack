apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'spring-boot-backend'
        static_configs:
          - targets: ['backend.default.svc.cluster.local:8081']
        metrics_path: /actuator/prometheus