spring.application.name=SpringDataRest

# Server
server.port=${SERVER_PORT:8081}

# H2 Database (mode fichier, pas TCP)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/voitureshop;DB_CLOSE_DELAY=-1}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring Data REST
spring.data.rest.base-path=/api

# Ollama
spring.ai.ollama.base-url=${SPRING_AI_OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=llama2