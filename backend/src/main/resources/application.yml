spring:
  application:
    name: SpringDataRest

  # Database H2
  datasource:
    url: jdbc:h2:file:./data/voitureshop
    driverClassName: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

  # Spring Data REST
  data:
    rest:
      base-path: /api

  # Spring AI Ollama (comme dans votre exemple)
  spring:
    ai:
      ollama:
        base-url: http://localhost:11434

# Server configuration
server:
  port: 8081

# Security (désactivée pour développement)
security:
  basic:
    enabled: false