services:
  # Service Ollama pour l'IA
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # Backend Spring Boot
  backend:
    build: .
    container_name: voiture-backend
    ports:
      - "8081:8081"
    depends_on:
      - ollama
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:file:/data/voitureshop
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=
      - SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./data:/data
    restart: unless-stopped

volumes:
  ollama_data: